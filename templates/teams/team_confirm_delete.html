{% extends "base.html" %}
{% block title %}Eliminar equipo{% endblock %}
{% block content %}
<div class="card">
  <h1>Eliminar equipo</h1>
  <p>¿Seguro que quieres eliminar "{{ team.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn" type="submit">Sí, eliminar</button>
  </form>
</div>
{% endblock %}
