{% extends "base.html" %}

{% block title %}Login | PremierFighters{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 40px auto;">
        <div style="text-align: center; margin-bottom: 24px;">
                <h1 style="margin: 0;">🔐 Iniciar sesión</h1>
                <p class="muted" style="margin: 8px 0 0;">Accede al panel de PremierFighters</p>
        </div>

        {% if form.errors %}
                <div class="message error" style="margin-bottom: 20px;">
                        Usuario o contraseña incorrectos.
                </div>
        {% endif %}

        <form method="post">
                {% csrf_token %}
                <div class="form-group">
                        {{ form.as_p }}
                </div>
                <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Entrar</button>
                </div>
        </form>
</div>

<style>
    .form-group p {
        margin: 16px 0 0;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #0f172a;
        font-size: 14px;
    }

    .form-group input[type="text"],
    .form-group input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
    }

    .form-group input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
</style>
{% endblock %}
