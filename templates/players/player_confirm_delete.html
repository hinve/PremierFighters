{% extends "base.html" %}
{% block title %}Eliminar jugador{% endblock %}
{% block content %}
<div class="card">
  <h1>🗑️ Eliminar jugador</h1>
  <p style="background: #fee2e2; border: 1px solid #fecaca; border-radius: 12px; padding: 16px; color: #991b1b; margin-bottom: 24px;">
    ⚠️ <strong>Cuidado:</strong> ¿Estás seguro que quieres eliminar "{{ player.nickname }}"? Esta acción no se puede deshacer.
  </p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button class="btn btn-danger" type="submit">🗑️ Sí, eliminar</button>
      <a class="btn" href="{% url 'player_detail' player.id %}">← Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
